<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your ShopEase account to continue shopping.">
  <title>ShopEase | Login</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/global_1.css">
  <link rel="stylesheet" href="css/login_1.css">
  <script src="js/data.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body>
  <div class="bg"></div>
  <main class="form-page">
    <section class="form-area">
      <div class="container form-wrap">
        <div class="card left-side box">
          <a class="logo form-logo" href="index.html" aria-label="Return to ShopEase home page">
            <img src="assets/logo.svg" alt="ShopEase logo">
            <span>ShopEase</span>
          </a>

          <p class="small-head">Welcome back</p>
          <h1>Sign in to continue shopping .</h1>

          <div class="point-box">
            
          </div>
        </div>

        <div class="card right-side box">
          <div class="form-head">
            <h2>Login</h2>
            <p>Enter valid details to  login into ShopEase.</p>
          </div>

          <form id="loginForm" novalidate>
            <label class="field" for="loginEmail">
              <span>Email address</span>
              <input id="loginEmail" name="email" type="email" autocomplete="off" required placeholder="student@example.com">
            </label>

            <label class="field" for="loginPassword">
              <span>Password</span>
              <input id="loginPassword" name="password" type="password" autocomplete="off" required placeholder="Enter your password">
            </label>

            <button class="btn btn-primary full-width" type="submit">Sign in</button>
            <p class="form-message" id="loginMessage"></p>
          </form>

          <p class="help">
            Need an account?
            <a class="text-link" href="signup.html">Create one here</a>
          </p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
